name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Menggunakan Gradle bawaan Ubuntu secara langsung tanpa caching pihak ketiga
    - name: Install and Build with Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        gradle build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-jar
        path: build/libs/*.jar
