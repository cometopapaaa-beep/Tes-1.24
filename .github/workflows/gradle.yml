name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Memberikan izin eksekusi pada gradlew agar tidak error exit code 126
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Build proyek menggunakan Gradle Wrapper bawaan proyek kamu
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Menyimpan hasil file .jar agar bisa diunduh
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-jar
        path: build/libs/*.jar
